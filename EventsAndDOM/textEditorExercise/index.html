<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Text Editor</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f0f0; }
    .editor-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 500px; text-align: center; }
    #text-display {
      background-color: cyan;
      color: darkred;
      font-size: 47px;
      font-family: Georgia, serif;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #000;
    }
    .controls button { background-color: #3f4b8e; color: white; border: none; padding: 8px 14px; margin: 4px; border-radius: 4px; cursor: pointer; }
    .control-row { margin: 10px 0; display: flex; justify-content: center; align-items: center; gap: 10px; }
  </style>
</head>
<body>

<div class="editor-card">
  <h2>Interactive Text Editor</h2>
  
  <div id="text-display">HELLO</div>

  <div class="controls">
    <div class="control-row">
      <button id="btnBold">Bold</button>
      <button id="btnItalic"><em>Italic</em></button>
      <button id="btnLeft">Left</button>
      <button id="btnCenter">Center</button>
      <button id="btnRight">Right</button>
    </div>

    <div class="control-row">
      <button id="btnUpper">Upper Case</button>
      <button id="btnLower">Lower Case</button>
      <button id="btnCapital">Capitalize</button>
      <button id="btnClear">Clear Text</button>
    </div>

    <div class="control-row">
      <label>Text Color: <input type="color" id="textColor" value="#8b0000"></label>
      <label>Background: <input type="color" id="bgColor" value="#00ffff"></label>
    </div>

    <div class="control-row">
      <label>Font Size: <input type="number" id="fontSize" value="47" style="width: 60px;"></label>
      <label>Font: 
        <select id="fontFamily">
          <option value="Georgia">Georgia</option>
          <option value="Arial">Arial</option>
          <option value="Times New Roman">Times New Roman</option>
        </select>
      </label>
    </div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
